name = "natit-dk"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "natit.dk", custom_domain = true }]

[assets]
directory = "./site"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[vars]
TEABLE_TABLE_ID = "tblFW1AiHL2M6sQvuZd"

[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[observability]
enabled = true
